# ---------------------------------------------------------------------------
# Press coverage, grouped by paper.
#
# `key` MUST match the BibTeX key of the paper in _bibliography/papers.bib.
# That link is what lets one entry render in two places automatically:
#   * /media/          -> the full list, grouped by paper
#   * /publications/   -> an "In the news:" line under that paper
#
# To add coverage: append an item to the right paper's `coverage:` list.
# To add a paper: add a new top-level block with its bib key, title and link.
# Keep `coverage` newest-first (it is also sorted by date at render time).
#
# Fields per item:
#   outlet    (required) name of the outlet, shown on both pages
#   headline  (required) article title, or a short phrase for non-article items
#   url       (required) link to the coverage
#   date      (required) YYYY-MM-DD; only month + year are displayed
#   byline    (optional) reporter's name
#   note      (optional) one line of extra context
# ---------------------------------------------------------------------------

